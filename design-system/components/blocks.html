<!-- @dsCard group="Components" name="콘텐츠 블록" subtitle="감정(웜) / 안심(OK) / 다음 스텝(틸) 단품" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif; background:#fff; color:#1C2B2E; padding:28px; display:flex; flex-direction:column; gap:14px; max-width:560px; }
  .blk { border-radius:14px; padding:16px 18px; font-size:14px; line-height:1.6; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .warm { background:#FBF3EC; } .warm .tag { color:#C96F4A; }
  .ok { background:#EAFFF4; } .ok .tag { color:#1F7A44; }
  .step { background:#E8F6F7; } .step .tag { color:#0F6D78; }
  .note { font-size:12.5px; color:#54646A; background:#F7F9F9; border:1px solid #E7EDED; border-radius:12px; padding:12px 14px; line-height:1.6; }
  .note b { color:#1C2B2E; }
</style>
</head>
<body>
  <div class="blk warm"><span class="tag">감정 블록 (웜)</span>멀리서 걱정 많으셨죠. — 감정을 먼저 한 문장으로 받고, 그 다음에 정보를 줍니다.</div>
  <div class="blk ok"><span class="tag">안심 블록 (OK 그린)</span>의사 선생님이 지난번보다 좋아졌다고 하셨어요. 이 부분은 안심하셔도 된다고 직접 말씀하신 내용이에요.</div>
  <div class="blk step"><span class="tag">다음 스텝 블록 (틸)</span><b>▶ 이번 주 안에 ○○ 서류를 발급받으세요.</b><br>왜냐하면 — 이유를 반드시 함께 적습니다.</div>
  <div class="note"><b>규칙:</b> 안심 블록은 서비스가 스스로 판단하는 문장 금지 — 반드시 "~라고 하셨어요" 전달 형식. 웜 블록은 페이지당 1~2개까지만(남용하면 온기가 소음이 됨).</div>
</body>
</html>
